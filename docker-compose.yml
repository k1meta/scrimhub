services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: scrimhub-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - scrimhub-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

volumes:
  scrimhub-sql:
